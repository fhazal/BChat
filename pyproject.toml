[project]
name = "bchat"
version = "0.1.0"
description = "Dark IRC client for Windows in the classic XChat 2 style"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "BajuBesi Labs" }]
dependencies = ["PySide6>=6.6", "pyspellchecker>=0.8", "cryptography>=42"]

[project.scripts]
bchat = "bchat.__main__:main"

[tool.setuptools.packages.find]
include = ["bchat*"]

[tool.setuptools.package-data]
bchat = ["assets/**/*.png", "assets/**/*.svg", "assets/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
